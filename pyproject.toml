[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "langgraph-newsroom"
version = "1.0.0"
description = "3-stage news production pipeline with human approval gates, checkpointing, and deterministic error recovery built on LangGraph."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "Nagarjuna Kamireddy", email = "writetonagarjuna@gmail.com" }
]
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "langgraph>=0.2.50",
  "langgraph-checkpoint-sqlite>=2.0.1",
  "pydantic>=2.9.2",
  "typer>=0.12.5",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.3",
]

[project.scripts]
newsroom = "newsroom.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/newsroom"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=newsroom --cov-branch --cov-report=term-missing --cov-fail-under=95"
